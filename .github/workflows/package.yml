name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Package
        shell: bash
        run: mvn -B package --no-transfer-progress -DskipTests

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jvm-explorer-${{ matrix.os }}
          path: |
            explorer/target/*.jar
            agent/target/*.jar
            launch-agent/target/*.jar
